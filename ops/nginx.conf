server {
    listen 80;
    server_name yurazlab.ru www.yurazlab.ru;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/yurazlab-acme;
    }
    location / { return 308 https://yurazlab.ru$request_uri; }
}
server {
    listen 443 ssl;
    server_name www.yurazlab.ru;
    ssl_certificate /etc/letsencrypt/live/yurazlab.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yurazlab.ru/privkey.pem;
    return 308 https://yurazlab.ru$request_uri;
}
server {
    listen 443 ssl;
    server_name yurazlab.ru;
    ssl_certificate /etc/letsencrypt/live/yurazlab.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yurazlab.ru/privkey.pem;
    gzip on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;
    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
